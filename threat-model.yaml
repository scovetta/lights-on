x-caller-obligations:
- id: O-CONTROL
  statement: Protect default-branch automation, prompts, policy, command files and overrides. Accept the association
    policy; never execute PR-head code in a privileged controller.
  provenance: *id002
  x-prose-source: THREAT_MODEL.md:540
- id: O-SOURCE
  statement: Supply a clean, secret-free, provider-appropriate checkout. Inspect context paths before disclosure.
  provenance: *id004
  x-prose-source: THREAT_MODEL.md:541
- id: O-HOST
  statement: Trust and review host, Docker, images, CLI/SDK and executable collaborators. Stronger support contracts
    remain Q2.
  provenance: *id007
  x-prose-source: THREAT_MODEL.md:542
- id: O-CREDENTIALS
  statement: Scope provider/GitHub/registry identities separately. Configure package-scoped tokens or trusted publishers;
    workflow permissions do not limit PATs.
  provenance: *id010
  x-prose-source: THREAT_MODEL.md:543
- id: O-COST
  statement: Set provider spending caps. Preserve concurrency, reservations and effective cache grants; inspect
    unknown usage and separate local/Actions ledgers.
  provenance: *id003
  x-prose-source: THREAT_MODEL.md:544
- id: O-CI
  statement: Protect the default branch; configure exact contexts/publishers/triggers. Retain review/CI gates, verify
    actual execution and inspect workflow definitions, not App ID alone.
  provenance: *id014
  x-prose-source: THREAT_MODEL.md:545
- id: O-OVERRIDE
  statement: Review hold/needs-human and security/compatibility changes. Distinguish author opt-in from protected/breaking
    overrides; keep sensitive external merge off unless coverage justifies it.
  provenance: *id006
  x-prose-source: THREAT_MODEL.md:546
- id: O-MIGRATE
  statement: Approve the committed exact plan, files, replacement evidence and offline commands. Labels or planning
    issues cannot authorize execution.
  provenance: *id011
  x-prose-source: THREAT_MODEL.md:547
- id: O-VALIDATE
  statement: Supply every required profile, image/cache, output declaration and synthetic service. Missing/blocked
    cases fail; passing proves neither semantics nor remote CI.
  provenance: *id018
  x-prose-source: THREAT_MODEL.md:548
- id: O-RECORDS
  statement: Protect state/output/policy/snapshots. Rerun after code/policy/source/candidate changes; writable hashes
    are not signatures. Never delete publication records to bypass retry refusal.
  provenance: *id005
  x-prose-source: THREAT_MODEL.md:549
- id: O-PUBLISH
  statement: Grant only intended independent capabilities; intersect flags with policy. Preserve installed-repository
    writes and read-only upstream access.
  provenance: *id017
  x-prose-source: THREAT_MODEL.md:550
- id: O-RELEASE
  statement: Configure trusted expected names, exact committed versions and builders. Enable release only after
    identity/auth setup; inspect artifacts and partial registry outcomes.
  provenance: *id016
  x-prose-source: THREAT_MODEL.md:551
- id: O-RETRY
  statement: Inspect confirmed branches/PRs/tags/versions and interrupted runs before retrying. Distinguish proposed,
    prepared, validated, published and merged outcomes.
  provenance: *id015
  x-prose-source: THREAT_MODEL.md:552
- id: O-STORAGE
  statement: Set separate host/VM storage bounds covering downloads, source copies, cache and persistent images.
  provenance: *id012
  x-prose-source: THREAT_MODEL.md:553
- id: O-INSTALL
  statement: Review source/target/origin and save customizations. Understand replacement/force/label options; inspect
    preview and discovery proposals before applying them.
  provenance: *id013
  x-prose-source: THREAT_MODEL.md:554
- id: O-OUTPUT
  statement: Encode raw logs/JSON/paths/code/diffs for each consumer. Never execute/render them as instructions
    or reuse context-specific encoding elsewhere.
  provenance: *id008
  x-prose-source: THREAT_MODEL.md:555
- id: O-EVIDENCE
  statement: Distinguish claims/facts, known/unknown usage, live/synthetic evidence and source/generated locks.
    Review model authority rather than accepting headings/counts.
  provenance: *id009
  x-prose-source: THREAT_MODEL.md:556
