x-projection-conventions:
  input-contract: caller_must_enforce expands the one shared O-* obligation verbatim. x-input-contract retains every
    exact per-operand condition/property/limit in addition; neither replaces the other. A composite record takes
    the weaker of input and obligation provenance; x-input-provenance retains the original tag when needed.
  mixed-inputs: Possibly controllable mixed rows use true; x-trust-classification/x-controllability-condition retain
    the exact split. JSON uses conditional with the same condition.
  joint-inputs: D01/D05 operands expand into both existing entry points. Shared helpers expand once for each family.
    x-source-operand-id identifies the 202 unique prose rows.
  outputs: A multi-family channel expands per family; x-source-channel-id preserves the 24 unique prose channels.
    x-output-contract preserves separately provenanced constraints not expressible as a §1.11 property reference.
  responsibilities: One responsibility per obligation/family enforces the same global O-* ID; no obligation is cloned.
    The 17 canonical obligations remain in x-caller-obligations.
  property-scope: Family membership selects the relevant operations, not all operations. The full stated conditions/limitations
    are mandatory.
  dependency-identifiers: Relied-on contract IDs are explicitly local derived indexes, not upstream published property
    IDs. Missing external acknowledgements/edge relations are not no-dependency/no-input assertions.
  unresolved-support: Unresolved build/support decisions stay in x-unresolved-build-variants; canonical supported
    flags cover only documented selections. ADV-HELPER stays inferred and conservatively in scope pending Q2.
